<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TODO List</title>
  </head>
  <body>
    <aside id="sidebar">
      <h2>Projects</h2>
      <ul id="project-list"></ul>
      <button id="add-project-btn" type="button">Add Project</button>
      <form id="project-form" hidden>
        <input
          type="text"
          name="Project name"
          placeholder="Project name"
          id="project-name"
          required
        />
        <button type="submit">Add</button>
        <button type="button" id="cancel-project-btn">Cancel</button>
      </form>
    </aside>
    <main id="content">
      <h1 id="project-title">Inbox</h1>
      <ul id="todo-list"></ul>
      <button id="add-task-btn" type="button">Add task</button>
    </main>
  </body>
</html>
