<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TODO List</title>
  </head>
  <body>
    <aside id="sidebar">
      <h2>Projects</h2>
      <ul id="project-list"></ul>
      <button id="add-project-btn" type="button">Add Project</button>
      <form aria-label="Project name" id="project-form" hidden>
        <input
          type="text"
          placeholder="Project name"
          id="project-name"
          required
        />
        <button type="submit">Add</button>
        <button type="button" id="cancel-project-btn">Cancel</button>
      </form>
    </aside>
    <main id="content">
      <h1 id="project-title">Inbox</h1>
      <ul id="todo-list"></ul>
      <form id="task-form" hidden>
        <input
          type="text"
          placeholder="Task name"
          id="task-title"
          aria-label="Task name"
          required
        />
        <textarea
          id="task-description"
          placeholder="Description"
          aria-label="Description"
        ></textarea>
        <input type="date" id="task-due-date" aria-label="Due date" />
        <select id="task-priority" aria-label="Priority">
          <option value="low">Low</option>
          <option value="medium">Medium</option>
          <option value="high">High</option>
        </select>
        <button type="submit">Add</button>
        <button type="button" id="cancel-task-btn">Cancel</button>
      </form>
      <button id="add-task-btn" type="button">Add Task</button>
    </main>
  </body>
</html>
